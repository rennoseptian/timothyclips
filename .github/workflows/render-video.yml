name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID composition yang mau di-render"
        default: "TimothyClip"
        required: true

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render ${{ github.event.inputs.composition }} out/${{ github.event.inputs.composition }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/${{ github.event.inputs.composition }}.mp4
